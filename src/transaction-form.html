<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loyalty Rewards System</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>

<body>

  <header>
    <h1>Loyalty Rewards System</h1>
    <p>Claim your loyalty reward here.</p>
  </header>

  <main>

    <section>
      <h2>Before You Submit</h2>

      <p>
        Please have your loyalty information, type of reward,
        and receipt information ready.
      </p>
    </section>

    <section>
      <h2>Reward Details</h2>

      <!--
        <form> groups the controls that participate
        in one submission.
      -->
      <form method="get">

        <!--
          <fieldset> groups related controls.
          <legend> gives the group a meaningful name.
        -->
        <fieldset>

          <legend>Claim Your Reward Here</legend>

          <!-- =====================================================
               CUSTOMER ID
               ===================================================== -->

          <section class="form-group">
            <label for="customerId">Customer ID</label>

            <input
              class="form-control"
              id="customerId"
              name="customerId"
              type="text"
              required
            >
          </section>

          <!-- =====================================================
               CLAIM DATE AND CATEGORY
               ===================================================== -->

          <section class="form-row">

            <section class="form-group">
              <label for="claimDate">Claim Date</label>

              <input
                class="form-control"
                id="claimDate"
                name="claimDate"
                type="date"
                required
              >
            </section>

            <section class="form-group">
              <label for="category">Category</label>

              <select
                class="form-control"
                id="category"
                name="category"
                required
              >
                <option value="">Choose a category</option>
                <option value="drink">Drink</option>
                <option value="meals">Meals</option>
                <option value="merch">Merch</option>
                <option value="other">Other</option>
              </select>
            </section>

          </section>

          <!-- =====================================================
               REWARD AMOUNT
               ===================================================== -->

          <section class="form-group">
            <label for="amount">Reward Amount ($)</label>

            <input
              class="form-control"
              id="amount"
              name="amount"
              type="number"
              required
              min="0.01"
              step="0.01"
            >
          </section>

          <!-- =====================================================
               COMMENTS / REVIEW
               ===================================================== -->

          <section class="form-group">
            <label for="comments">Comments / Review</label>

            <textarea
              class="form-control"
              id="comments"
              name="comments"
              rows="4"
              required
            ></textarea>
          </section>

          <!-- =====================================================
               RECEIPT CHECKBOX
               ===================================================== -->

          <section class="checkbox-group">
            <input
              id="receiptAttached"
              name="receiptAttached"
              type="checkbox"
              value="yes"
            >

            <label for="receiptAttached">
              Receipt attached
            </label>
          </section>

          <!--
            BUSINESS RULE FOR LATER:

            If the reward amount is greater than $15,
            a receipt is required.

            JavaScript or server-side logic will handle
            this rule later.
          -->

        </fieldset>

        <button type="submit">
          Submit Request
        </button>

      </form>

    </section>

  </main>

  <footer>
    <p>Don't forget to leave a review!</p>
  </footer>

</body>
</html>
