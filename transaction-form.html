<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loyalty Rewards System</title>
</head>

<body>

  <header>
    <h1>Loyalty Rewards System</h1>
    <p>Claim your loyalty reward here.</p>
  </header>

  <main>

    <section>
      <h2>Before You Submit</h2>
      <p>
        Please have your loyalty information, type of reward, 
        and receipt information ready.
      </p>
    </section>

    <section>
      <h2>Reward Details</h2>

      <!--
        <form> groups the controls that participate in one submission.

        method="get" is used only for this classroom demo.
        After a valid submission, notice that the field NAMES appear
        in the browser URL as submitted data.

        In the real capstone, submission will later go through
        JavaScript/API/backend logic.
      -->
      <form method="get">

        <!--
          <fieldset> groups related controls.
          <legend> gives the group a meaningful name.
        -->
        <fieldset>

          <legend>Claim Your Reward Here</legend>

          <!-- =====================================================
               CUSTOMER ID
               ===================================================== -->

          <!--
            for="customerId" must match id="customerId".
            This connects the visible label to the input.
          -->
          <label for="customerId">Customer ID</label>
          <!--for connect the label to input id-->
          <input
            id="customerId"
            name="customerId"
            type="text"
            required
          >
          <!-- <br> new line-->
          <br><br>

          <!-- =====================================================
               CLAIM DATE
               ===================================================== -->

          <label for="claimDate">Claim Date</label>

          <input
            id="claimDate"
            name="claimDate"
            type="date"
            required
          >

          <br><br>

          <!-- =====================================================
               CATEGORY
               ===================================================== -->

          <label for="category">Category</label>

          <!--
            <select> is appropriate because the business allows
            a known set of categories.
          -->
          <select
            id="category"
            name="category"
            required
          >
            <option value="">Choose a category</option>
            <option value="Drink">Drink</option>
            <option value="Meals">Meals</option>
            <option value="Merch">Merch</option>
            <option value="Other">Other</option>
          </select>

          <br><br>

          <!-- =====================================================
               AMOUNT
               ===================================================== -->

          <label for="amount">Reward Amount ($)</label>

          <input
            id="amount"
            name="amount"
            type="number"
            required
            min="0.01"
            step="0.01"
          >

          <br><br>

          <!-- =====================================================
               COMMENTS/REVIEW
               ===================================================== -->

          <label for="comments">Comments/Review</label>
          <br>

          <textarea
            id="comments"
            name="comments"
            rows="4"
            cols="45"
            required
          ></textarea>

          <br><br>

          <!-- =====================================================
               RECEIPT CHECKBOX
               ===================================================== -->

          <!--
            Checkbox = yes/no flag.

            BUSINESS RULE FOR LATER:
            If amount > $15, a receipt is required.

          -->
          <input
            id="receiptAttached"
            name="receiptAttached"
            type="checkbox"
            value="yes"
          >

          <label for="receiptAttached">
            Receipt attached
          </label>

        </fieldset>

        <br>

        <!--
          type="submit" asks the browser to submit the form.

          Before submission, the browser checks the native constraints.
          Try:
          - leaving a required field empty
          - entering amount = 0
          - entering amount = 5600
        -->
        <button type="submit">
          Submit Request
        </button>

      </form>

    </section>

  </main>

  <footer>
    <p>Don't forget to leave a review!</p>
  </footer>

</body>
</html>
